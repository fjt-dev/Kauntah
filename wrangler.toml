name = "kauntah"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "CounterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CounterDO"]

[[kv_namespaces]]
binding = "IMAGE_CACHE"
id = "05949d0dd5f84099b88fac30399203dc"

[[d1_databases]]
binding = "DB"
database_name = "kauntah-backup"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1"

[ratelimits.simple]
limit = 30
period = 60

[observability.logs]
enabled = true
invocation_logs = true
